<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="utf8-title utf8-desc">
  <title id="utf8-title">UTF-8 Analyzer</title>
  <desc id="utf8-desc">Project logo for UTF-8 Analyzer coursework</desc>
  <rect width="1200" height="900" fill="#eae2d2"/>
  <rect x="72" y="72" width="1056" height="756" rx="28" fill="#fffdf7" stroke="#2e2a21" stroke-opacity=".12" stroke-width="2"/>
  <!-- byte blocks -->
  <g font-family="DM Mono, ui-monospace, monospace" font-size="34" text-anchor="middle">
    <rect x="280" y="280" width="140" height="100" rx="12" fill="#4f672c"/>
    <text x="350" y="342" fill="#fffdf7">F0</text>
    <rect x="440" y="280" width="140" height="100" rx="12" fill="#2e2a21"/>
    <text x="510" y="342" fill="#fffdf7">9F</text>
    <rect x="600" y="280" width="140" height="100" rx="12" fill="#2e2a21"/>
    <text x="670" y="342" fill="#fffdf7">98</text>
    <rect x="760" y="280" width="140" height="100" rx="12" fill="#2e2a21"/>
    <text x="830" y="342" fill="#fffdf7">80</text>
  </g>
  <!-- brace linking to codepoint -->
  <path d="M300 400v36c0 24 20 44 44 44h512c24 0 44-20 44-44v-36" fill="none" stroke="#dca23d" stroke-width="8" stroke-linecap="round"/>
  <rect x="470" y="460" width="260" height="72" rx="12" fill="#a9ca6b"/>
  <text x="600" y="508" text-anchor="middle" font-family="DM Mono, ui-monospace, monospace" font-size="36" font-weight="500" fill="#2e2a21">U+1F600</text>
  <text x="600" y="690" text-anchor="middle" font-family="Bricolage Grotesque, system-ui, sans-serif" font-size="72" font-weight="720" letter-spacing="-0.01em" fill="#2e2a21">UTF-8 Analyzer</text>
  <text x="600" y="748" text-anchor="middle" font-family="DM Mono, ui-monospace, monospace" font-size="28" letter-spacing="0.18em" fill="#736b5b">UCSD CSE 29 · SYSTEMS</text>
</svg>
