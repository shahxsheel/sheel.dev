<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" fill="none">
  <title>Bit, a tiny robot that jumps and waves when clicked</title>
  <g id="bit">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -28;0 0" keyTimes="0;0.2;0.62;1" begin="hitbox.click" dur=".78s" fill="freeze"/>
    <g stroke="#181711" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M75 55 56 31M125 55l19-24"/>
      <circle cx="56" cy="31" r="6" fill="#dca23d" stroke="none"/>
      <circle cx="144" cy="31" r="6" fill="#a9ca6b" stroke="none"/>
      <path d="m70 166-30 19-10-20M85 187l-20 38M115 187l20 38M55 225h20M125 225h20"/>
      <g transform="rotate(90 130 160)">
        <animateTransform attributeName="transform" type="rotate" values="90 130 160;90 130 160;-18 130 160;22 130 160;-18 130 160;0 130 160" keyTimes="0;0.2;0.4;0.6;0.8;1" begin="hitbox.click" dur="1.4s" fill="freeze"/>
        <path d="m130 166 40-46m0 0 5-15m-5 15 18-8m-18 8 12 10"/>
      </g>
      <path d="M85 131v19h30v-19" fill="#f6f1e6"/>
      <rect x="60" y="145" width="80" height="45" rx="12" fill="#f6f1e6"/>
      <rect x="45" y="55" width="110" height="80" rx="16" fill="#f6f1e6"/>
      <path d="M148 66v58" stroke="#dca23d" stroke-width="2"/>
      <rect x="58" y="68" width="84" height="54" rx="8" fill="#181711" stroke="none">
        <animate attributeName="fill" values="#181711;#a9ca6b;#262521" keyTimes="0;.15;1" begin="hitbox.click" dur=".6s" fill="freeze"/>
      </rect>
    </g>
    <g transform="translate(100 95)" fill="#a9ca6b">
      <path d="m-14-12 10 0 4 5 4-5h10l4 5v9L0 18-18 2v-9z">
        <animate attributeName="opacity" values="0;0;1;0;1" keyTimes="0;.66;.76;.87;1" begin="hitbox.click" dur="1.4s" fill="freeze"/>
      </path>
      <path d="m-13-2 5 4 8-9" fill="none" stroke="#a9ca6b" stroke-width="3" opacity="1">
        <animate attributeName="opacity" values="1;1;0" keyTimes="0;.15;1" begin="hitbox.click" dur=".25s" fill="freeze"/>
      </path>
      <path d="M7 8h10" stroke="#a9ca6b" stroke-width="3" opacity="1">
        <animate attributeName="opacity" values="1;1;0" keyTimes="0;.15;1" begin="hitbox.click" dur=".25s" fill="freeze"/>
      </path>
    </g>
  </g>
  <rect id="hitbox" width="200" height="250" fill="transparent" style="cursor:pointer"/>
</svg>
