<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work Experience — Sheel Shah</title>
  <meta name="description" content="Sheel Shah's work experience.">
  <link rel="canonical" href="https://sheel.dev/work/">
  <link rel="icon" href="../assets/favicon.png?v=20260813-2" type="image/png">
  <meta name="theme-color" content="#000000">
  <script>
    (function () { try { if (localStorage.getItem("sheel.invert") === "1") document.documentElement.classList.add("invert"); } catch (e) {} })();
  </script>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/stage.css?v=20260813-1">
  <link rel="stylesheet" href="../styles/pages.css">
</head>
<body>
  <article class="page">
    <a class="page__back" href="../">&#8592; back to the table</a>
    <p class="meta">Work Experience</p>
    <h1>Where I've shipped.</h1>
    <p class="page__intro">The short version. The long version, code and commits and all, lives on
      <a class="inline" href="https://github.com/shahxsheel">GitHub</a>.</p>

    <div id="entries">
      <noscript>
        <p>This page lists work experience. With JavaScript off, head to
          <a class="inline" href="https://github.com/shahxsheel">GitHub</a> or the
          <a class="inline" href="../assets/Sheel-Shah-Resume.pdf">resume</a>.</p>
      </noscript>
    </div>

    <hr class="rule">
    <a class="gh-link" href="https://github.com/shahxsheel">See the work on GitHub &#8599;</a>
  </article>

  <div class="grain" aria-hidden="true"></div>
  <script src="../scripts/invert.js" defer></script>
  <script src="../scripts/cursor-ani.js" defer></script>
  <script src="../scripts/star-trail.js" defer></script>
  <script>
    (function () {
      "use strict";
      var host = document.getElementById("entries");
      fetch("../content/experience.json")
        .then(function (r) { return r.json(); })
        .then(function (rows) {
          host.innerHTML = rows.map(function (e) {
            var bullets = (e.bullets || []).map(function (b) { return "<li>" + esc(b) + "</li>"; }).join("");
            var period = e.period ? esc(e.period) : [e.start, e.end].filter(Boolean).map(esc).join(" &ndash; ");
            var company = [e.company, e.location].filter(Boolean).map(esc).join(" &middot; ");
            return '<section class="entry">' +
              '<div class="entry__head">' +
                '<span class="entry__role">' + esc(e.role) + '</span>' +
                '<span class="meta">' + period + '</span>' +
              '</div>' +
              '<p class="entry__company">' + company + '</p>' +
              '<ul class="entry__bullets">' + bullets + '</ul>' +
            '</section>';
          }).join("");
        })
        .catch(function () {
          host.innerHTML = '<p>Could not load experience. Try <a class="inline" href="https://github.com/shahxsheel">GitHub</a>.</p>';
        });
      function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
    })();
  </script>
</body>
</html>
