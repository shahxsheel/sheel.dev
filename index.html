<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sheel Shah — Engineer</title>
  <meta name="description" content="Sheel Shah builds usable machines, from embedded systems and AI infrastructure to real-time software.">
  <link rel="canonical" href="https://sheel.dev/">
  <link rel="icon" href="assets/favicon.png?v=20260813-2" type="image/png">
  <meta name="theme-color" content="#000000">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sheel Shah — Engineer">
  <meta property="og:description" content="I make machines usable.">
  <meta property="og:url" content="https://sheel.dev/">
  <meta property="og:image" content="https://sheel.dev/assets/plate/table-base.webp">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Apply invert before first paint to avoid a flash (DESIGN.md §6) -->
  <script>
    (function () {
      try { if (localStorage.getItem("sheel.invert") === "1") document.documentElement.classList.add("invert"); } catch (e) {}
    })();
  </script>

  <!-- Preload the plate (DESIGN.md §11). AVIF only — it is the format
       image-set resolves to on every browser that ships it today. -->
  <link rel="preload" as="image" href="assets/plate/table-base.avif" media="(min-width: 768px)" fetchpriority="high">
  <link rel="preload" as="image" href="assets/plate/table-base-mobile.avif" media="(max-width: 767px)" fetchpriority="high">

  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/stage.css?v=20260813-1">
  <link rel="stylesheet" href="styles/pages.css">
</head>
<body>

  <!-- ============ THE STAGE (≥ 768px) ============ -->
  <main id="stage" aria-label="Sheel Shah — desk scene">

    <div class="chrome">
      <!-- Top-left: name + tagline (DESIGN.md §5.4) -->
      <div class="chrome__corner chrome__tl">
        <div class="brand">
          <span class="brand__name">Sheel Shah</span>
        </div>
        <p class="tagline">
          Engineer.<br>
          I make machines usable. <span class="tagline__arrow" aria-hidden="true">&#8599;</span>
        </p>
      </div>

      <!-- Top-right: nav + invert toggle (DESIGN.md §5.4) -->
      <div class="chrome__corner chrome__tr">
        <nav class="nav" aria-label="Primary">
          <a href="about/">About</a>
          <a href="assets/Sheel-Shah-Resume.pdf">Resume</a>
          <a href="contact/">Contact</a>
          <span class="nav__rule" aria-hidden="true"></span>
          <button class="invert-toggle" type="button" aria-pressed="false" aria-label="Invert the scene">
            <span class="invert-toggle__text">Invert</span>
            <span class="invert-toggle__switch" aria-hidden="true"></span>
          </button>
        </nav>
      </div>

    </div>

    <!-- The plate is its own box so the objects stay pinned to the photograph.
         The stage can then grow past it, keeping the plate on the floor and
         any letterbox space above it, without object coordinates drifting. Kept after .chrome in
         the DOM so tab order still runs name → nav → objects (§10). -->
    <div class="plate">
      <!-- Hotspots (DESIGN.md §5.1, §5.2). Invisible until art lands; hover is the affordance. -->
      <!-- The ar custom property is the art's own ratio so the box is reserved before it loads.
           The rotation property is 0: the tilt is baked into the artwork, and adding CSS
           rotation on top would double it. -->
      <a class="object object--art" data-name="magazine" href="work/"
         aria-label="Work Experience — magazine"
         style="--x:23%; --y:18%; --w:22%; --ar:1024/1262; --r:0deg;"></a>

      <!-- Both artworks are tilted counter-clockwise in the file, so with no CSS rotation
           they read as parallel. +20deg overcomes the binder's baked tilt and
           leans it the other way, splaying the pair into a V. Rotation grows
           the bounding box (here by ~6% wide, ~12% tall), so the position values back off
           to hold 5.8% clear of the film strip and 3.9% of the mug. -->
      <a class="object object--art" data-name="binder" href="projects/"
         aria-label="Projects — CD binder"
         style="--x:52%; --y:15%; --w:27%; --ar:1000/987; --r:20deg;"></a>
    </div>

    <!-- Bottom-left status sits after the plate so tab order runs
         nav → objects → status, matching the visual reading order (§10).
         Reuses .chrome purely for its pointer-events handling. -->
    <div class="chrome">
      <div class="chrome__corner chrome__bl">
        <div class="status">
          <div class="status__line">Everything here was harder than it looks.</div>
          <div class="status__line">California, USA</div>
          <div class="status__line"><span class="status__dot" aria-hidden="true"></span>Available for work</div>
          <!-- Carries non-negotiable #2 now that the text list is gone. The
               nav has no room for a 4th item and a second nav row lands on the
               mug; this band (y 87-90%) measures clear on both plates. -->
          <div class="status__line"><a class="status__link" href="https://github.com/shahxsheel">github.com/shahxsheel &#8599;</a></div>
        </div>
      </div>
    </div>

    <div class="debug-readout" aria-hidden="true"></div>
  </main>

  <!-- No text list below the scene: it read as dead black space under the
       plate. Resume, Contact and GitHub are plain <a> in the chrome, and the
       hotspots are real links, so §2 still holds with JS off. -->

  <!-- Global grain, kept outside any transformed wrapper (DESIGN.md §4.4) -->
  <div class="grain" aria-hidden="true"></div>

  <script src="scripts/invert.js" defer></script>
  <script src="scripts/stage.js" defer></script>
  <script src="scripts/cursor-ani.js?v=20260813-1" defer></script>
  <script src="scripts/star-trail.js" defer></script>
</body>
</html>
